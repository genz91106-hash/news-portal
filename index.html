<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admission & World News</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--fg:#1b1d2a;--mut:#6a6f85;--line:#e4e6ee;--acc:#5b5bf0;--sh:0 2px 10px rgba(30,35,70,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f16;--card:#181a25;--fg:#ecedf5;--mut:#9396ab;--line:#272a3a;--acc:#8b8bff;--sh:none}}
:root[data-theme="dark"]{--bg:#0e0f16;--card:#181a25;--fg:#ecedf5;--mut:#9396ab;--line:#272a3a;--acc:#8b8bff;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Noto Sans Bengali','Kalpurush',sans-serif;line-height:1.45}
.hero{background:linear-gradient(135deg,#4f46e5,#9333ea 60%,#ec4899);color:#fff;padding:18px 14px 22px;border-radius:0 0 22px 22px}
.hero .in,main{max-width:780px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:21px;margin:0}
.sub{opacity:.85;font-size:12.5px;margin-top:2px}
.lang{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:16px;padding:7px 13px;font-size:13px;font-weight:600}
.btns{display:flex;gap:6px;flex-shrink:0}.wa{background:#25d366!important}
.next{display:flex;gap:10px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.nc{flex:0 0 78%;max-width:300px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:11px 12px;backdrop-filter:blur(6px)}
.nc small{opacity:.85;font-size:12px}.nc .t{font-weight:700;margin:2px 0 8px;font-size:15px}
main{padding:12px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow-x:auto;padding:10px 0;background:var(--bg);scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:7px 14px;font-size:14px;box-shadow:var(--sh)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;margin:2px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;box-shadow:var(--sh)}
.item{border-left:4px solid var(--c,#999)}
.item a{color:var(--fg);text-decoration:none;font-weight:650;font-size:15.5px}.item a:hover{color:var(--acc)}
.meta{font-size:12px;color:var(--mut);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;border-radius:8px;padding:1px 8px;color:#fff;background:var(--c,#999)}
.snip{font-size:13px;color:var(--mut);margin-top:5px}
details.brief summary{cursor:pointer;font-weight:650}
.brief h3{font-size:15px;margin:14px 0 4px;color:var(--acc)}.brief ul{margin:4px 0;padding-left:20px}.brief li{margin:6px 0;font-size:14px}
.uh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.uh b{font-size:16px}
.chip{font-size:11px;border-radius:8px;padding:2px 8px;font-weight:600;white-space:nowrap}
.confirmed{background:#d9f5e3;color:#0b6b32}.probable{background:#fff1cc;color:#8a5a00}.tba{background:#e8e9f0;color:#555}
.cat{color:var(--mut);font-size:12px}
.note{font-size:12px;color:var(--mut);margin-top:4px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.ev:first-of-type{margin-top:8px}
.ev .l{font-size:14px;font-weight:600}.ev .d{font-size:12px;color:var(--mut)}
.cd{display:flex;gap:5px}
.cd span{min-width:42px;text-align:center;background:var(--bg);border-radius:9px;padding:4px 5px;font-size:10px;color:var(--mut)}
.cd b{display:block;font-size:17px;color:var(--acc);font-variant-numeric:tabular-nums}
.nc .cd span{background:rgba(255,255,255,.2);color:#fff}.nc .cd b{color:#fff;font-size:18px}
.done{font-size:12px;color:var(--mut);font-weight:600}
.qa{padding:10px 0;border-top:1px dashed var(--line)}.q{font-weight:600;font-size:15px;margin-bottom:4px}.ans summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:6px}.a{margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px}.sec{font-size:15px;margin:18px 0 4px}
.warn{font-size:12px;color:var(--mut);text-align:center;margin:14px 0}
</style>
</head>
<body>
<div class="hero"><div class="in">
 <div class="top"><div><h1 id="ttl"></h1><div class="sub" id="upd"></div></div><div class="btns"><button class="lang wa" id="wa"></button><button class="lang" id="lb"></button></div></div>
 <div class="next" id="next"></div>
</div></div>
<main>
 <div id="briefs"></div>
 <div class="tabs" id="tabs"></div>
 <input id="q" style="display:none">
 <div id="list"></div>
 <div class="warn" id="warn"></div>
</main>
<script>
const TOP=['Admission','IntlGK','NatGK','All','Education','Scholarship','Bangladesh','AI','Business','Tech'];
const COL={AI:'#8b5cf6',Business:'#10b981',Tech:'#3b82f6',Bangladesh:'#ef4444',Education:'#f59e0b',Scholarship:'#ec4899',IntlGK:'#0ea5e9',BDGK:'#16a34a'};
const L={en:{Admission:'🎓 Admission',All:'All',Education:'Education',Scholarship:'Scholarship',Bangladesh:'Bangladesh',AI:'AI',Business:'Business',Tech:'Tech',IntlGK:'🌍 International GK',NatGK:'🇧🇩 National GK',BDGK:'National GK',gkw:'AI-made quiz cards from daily news headlines. Verify before memorising.',gkn:'No GK cards yet. They appear after the next GK run.',cards:'cards',show:'Show answer',latest:'Latest headlines',
 title:'🎓 Admission & World News',search:'Search headlines…',wait:'Waiting for first update…',upd:'Updated',auto:'auto-refreshes',none:'No news yet.',
 mor:'☀️ Morning Brief',ngt:'🌙 Night Brief',m:'m ago',h:'h ago',d:'d ago',btn:'বাংলা',wa:'📲 WhatsApp',in:'Starts in',left:'Closes in',done:'Finished',next:'Next up',
 u:['days','hrs','min','sec'],confirmed:'Confirmed',probable:'Probable',tba:'Dates TBA',warn:'Dates come from news reports. Always confirm on the official university website.'},
bn:{Admission:'🎓 ভর্তি',All:'সব',Education:'শিক্ষা',Scholarship:'স্কলারশিপ',Bangladesh:'বাংলাদেশ',AI:'এআই',Business:'ব্যবসা',Tech:'প্রযুক্তি',IntlGK:'🌍 আন্তর্জাতিক GK',NatGK:'🇧🇩 জাতীয় GK',BDGK:'জাতীয় GK',gkw:'দৈনিক খবরের শিরোনাম থেকে এআই-বানানো কুইজ কার্ড। মুখস্থের আগে যাচাই করুন।',gkn:'এখনো GK কার্ড নেই। পরের GK রানের পর আসবে।',cards:'টি কার্ড',show:'উত্তর দেখুন',latest:'সর্বশেষ শিরোনাম',
 title:'🎓 ভর্তি ও বিশ্বের খবর',search:'শিরোনাম খুঁজুন…',wait:'প্রথম আপডেটের অপেক্ষায়…',upd:'আপডেট',auto:'নিজে থেকেই রিফ্রেশ হয়',none:'এখনো কোনো খবর নেই।',
 mor:'☀️ সকালের সারাংশ',ngt:'🌙 রাতের সারাংশ',m:' মিনিট আগে',h:' ঘণ্টা আগে',d:' দিন আগে',btn:'English',wa:'📲 হোয়াটসঅ্যাপ',in:'শুরু হতে বাকি',left:'শেষ হতে বাকি',done:'শেষ',next:'পরের ইভেন্ট',
 u:['দিন','ঘণ্টা','মিনিট','সেকেন্ড'],confirmed:'নিশ্চিত',probable:'সম্ভাব্য',tba:'তারিখ ঘোষণা হয়নি',warn:'তারিখগুলো সংবাদ থেকে নেওয়া। সবসময় বিশ্ববিদ্যালয়ের অফিসিয়াল ওয়েবসাইটে যাচাই করুন।'}};
let lang=localStorage.getItem('lang')||'en',topic='Admission',items=[],q='',news={},br={},adm=[],gk={days:[]};
const bd=n=>lang==='bn'?String(n).replace(/\d/g,x=>'০১২৩৪৫৬৭৮৯'[x]):String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=d=>{const m=Math.max(0,(Date.now()-new Date(d))/60000),t=L[lang];return bd(m<60?Math.floor(m)+t.m:m<1440?Math.floor(m/60)+t.h:Math.floor(m/1440)+t.d)};
const fmt=(d,time)=>new Date(d).toLocaleString(lang==='bn'?'bn-BD':'en-GB',{timeZone:'Asia/Dhaka',day:'numeric',month:'short',year:'numeric',...(time?{hour:'numeric',minute:'2-digit'}:{})});
function md(t){let h='',ul=false;const b=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');for(const raw of t.split('\n')){const l=esc(raw.trim());
 if(l.startsWith('## ')){if(ul){h+='</ul>';ul=false}h+='<h3>'+b(l.slice(3))+'</h3>'}
 else if(/^[-*] /.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+b(l.slice(2))+'</li>'}
 else if(l){if(ul){h+='</ul>';ul=false}h+='<p>'+b(l)+'</p>'}}return h+(ul?'</ul>':'')}
/* ---- countdown ---- */
function target(e){const n=Date.now(),s=+new Date(e.start),en=e.end?+new Date(e.end):0;if(n<s)return{t:s,k:'in'};if(en&&n<en)return{t:en,k:'left'};return null}
function cdHtml(t){const x=Math.max(0,t-Date.now())/1000,v=[Math.floor(x/86400),Math.floor(x%86400/3600),Math.floor(x%3600/60),Math.floor(x%60)],u=L[lang].u;
 return v.map((n,i)=>`<span><b>${bd(String(n).padStart(i?2:1,'0'))}</b>${u[i]}</span>`).join('')}
function evRow(e){const tg=target(e),t=L[lang],lb=lang==='bn'&&e.labelBn?e.labelBn:e.label;
 const when=fmt(e.start,e.time)+(e.end?' → '+fmt(e.end,e.time):'');
 return `<div class="ev"><div><div class="l">${esc(lb)}</div><div class="d">${when}${tg?' · '+t[tg.k]:''}</div></div>${tg?`<div class="cd" data-t="${tg.t}">${cdHtml(tg.t)}</div>`:`<div class="done">${t.done}</div>`}</div>`}
function renderAdm(){const t=L[lang];
 const sorted=[...adm].sort((a,b)=>{const f=u=>Math.min(...u.events.map(e=>{const g=target(e);return g?g.t:Infinity}),Infinity);return f(a)-f(b)});
 document.getElementById('list').innerHTML=sorted.map(u=>`<div class="card"><div class="uh"><div><b>${esc(lang==='bn'&&u.nameBn?u.nameBn:u.name)}</b><div class="cat">${esc(u.cat)}</div></div><span class="chip ${u.status}">${t[u.status]}</span></div>${u.note?`<div class="note">${esc(lang==='bn'&&u.noteBn?u.noteBn:u.note)}</div>`:''}${u.events.map(evRow).join('')}</div>`).join('')}
function renderNext(){const t=L[lang],all=[];
 adm.forEach(u=>u.events.forEach(e=>{const g=target(e);if(g)all.push({u,e,g})}));all.sort((a,b)=>a.g.t-b.g.t);
 document.getElementById('next').innerHTML=all.slice(0,5).map(x=>`<div class="nc"><small>${t[x.g.k]} · ${esc(x.u.short||x.u.name.split(' (')[0])}</small><div class="t">${esc(lang==='bn'&&x.e.labelBn?x.e.labelBn:x.e.label)}</div><div class="cd" data-t="${x.g.t}">${cdHtml(x.g.t)}</div></div>`).join('')}
setInterval(()=>{let re=false;document.querySelectorAll('.cd').forEach(el=>{const t=+el.dataset.t;if(t-Date.now()<=0)re=true;else el.innerHTML=cdHtml(t)});if(re){renderNext();if(topic==='Admission')renderAdm()}},1000);
/* ---- news ---- */
function renderTabs(){document.getElementById('tabs').innerHTML=TOP.map(x=>`<button class="${x===topic?'on':''}" onclick="topic='${x}';renderTabs();renderMain()">${L[lang][x]}</button>`).join('')}
function newsCard(i){return `<div class="card item" style="--c:${COL[i.topic]||'#888'}"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="meta"><span class="tag">${esc(L[lang][i.topic]||i.topic)}</span><span>${esc(i.source)}</span><span>· ${ago(i.date)}</span></div>${i.snippet?`<div class="snip">${esc(i.snippet.slice(0,160))}…</div>`:''}</div>`}
function renderList(){const gkT=['IntlGK','BDGK'],f=items.filter(i=>(topic==='All'?!gkT.includes(i.topic):i.topic===topic)&&(!q||(i.title+i.snippet).toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=f.slice(0,150).map(newsCard).join('')||`<div class="card">${L[lang].none}</div>`}
function renderGK(){const isI=topic==='IntlGK',key=isI?'intl':'national',nt=isI?'IntlGK':'BDGK',t=L[lang];
 const days=(gk.days||[]).filter(d=>(d[key]||[]).length);
 let h=`<div class="note">${t.gkw}</div>`;
 if(!days.length)h+=`<div class="card">${t.gkn}</div>`;
 days.forEach((d,i)=>{h+=`<details class="card" ${i===0?'open':''}><summary><b>${fmt(d.date+'T12:00:00+06:00',false)}</b> · ${bd(d[key].length)} ${t.cards}</summary>`+d[key].map(c=>`<div class="qa"><div class="q">${esc(lang==='bn'&&c.qBn?c.qBn:c.q)}</div>${c.tag?`<span class="chip tba">${esc(c.tag)}</span>`:''}<details class="ans"><summary>${t.show}</summary><div class="a">${esc(lang==='bn'&&c.aBn?c.aBn:c.a)}</div></details></div>`).join('')+'</details>'});
 h+=`<h3 class="sec">${t.latest}</h3>`+items.filter(i=>i.topic===nt).slice(0,60).map(newsCard).join('');
 document.getElementById('list').innerHTML=h}
function renderMain(){const isA=topic==='Admission',isG=topic==='IntlGK'||topic==='NatGK';document.getElementById('q').style.display=(isA||isG)?'none':'block';isA?renderAdm():isG?renderGK():renderList()}
function renderBriefs(){if(!br.m)return;const t=L[lang],pick=b=>(lang==='bn'&&b.text_bn)||b.text||b.text_bn||'';
 const c=(b,l)=>`<details class="card brief"><summary>${l}${b.generated?' · '+ago(b.generated):''}</summary>${md(pick(b))}</details>`;
 const newer=new Date(br.m.generated||0)>new Date(br.n.generated||0);
 document.getElementById('briefs').innerHTML=newer?c(br.m,t.mor)+c(br.n,t.ngt):c(br.n,t.ngt)+c(br.m,t.mor)}
function renderAll(){const t=L[lang];document.documentElement.lang=lang;document.getElementById('ttl').textContent=t.title;document.getElementById('q').placeholder=t.search;
 document.getElementById('lb').textContent=t.btn;document.getElementById('wa').textContent=t.wa;document.getElementById('warn').textContent=t.warn;
 document.getElementById('upd').textContent=news.updated?t.upd+' '+ago(news.updated)+' · '+t.auto:t.wait;renderTabs();renderNext();renderMain();renderBriefs()}
function waSend(){
 if(!items.length){alert(L[lang].none);return}
 const ord=['Bangladesh','AI','Scholarship','Business','Tech'],em={Bangladesh:'🇧🇩',AI:'🤖',Scholarship:'🎓',Business:'💼',Tech:'💻'},day=Date.now()-864e5;
 const pick=(tp,n)=>{const a=items.filter(i=>i.topic===tp),r=a.filter(i=>+new Date(i.date)>day);return(r.length?r:a).slice(0,n)};
 const build=(n,links)=>{let s=(lang==='bn'?'📰 দ্রুত খবরের সারাংশ':'📰 Quick News Summary')+' · '+new Date().toLocaleDateString(lang==='bn'?'bn-BD':'en-GB',{timeZone:'Asia/Dhaka',day:'numeric',month:'short'})+'\n';
  ord.forEach(tp=>{const a=pick(tp,n);if(!a.length)return;s+='\n'+em[tp]+' *'+L[lang][tp]+'*\n';a.forEach(i=>{s+='• '+i.title+(links?'\n'+i.link:'')+'\n'})});return s.trim()};
 let txt='';for(const[n,l]of[[3,true],[2,true],[3,false],[2,false],[1,false]]){txt=build(n,l);if(encodeURIComponent(txt).length<=1800)break}
 window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
async function j(p){const r=await fetch(p+'?t='+Date.now());return r.json()}
async function load(){
 try{news=await j('data/news.json');items=news.items||[]}catch(e){}
 try{adm=await j('data/admissions.json')}catch(e){}
 try{gk=await j('data/gk.json')}catch(e){}
 try{const[m,n]=await Promise.all([j('data/brief-morning.json'),j('data/brief-night.json')]);br={m,n}}catch(e){}
 renderAll()}
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();renderList()};
document.getElementById('wa').onclick=waSend;
document.getElementById('lb').onclick=()=>{lang=lang==='en'?'bn':'en';localStorage.setItem('lang',lang);renderAll()};
load();setInterval(load,180000);
</script>
</body>
</html>
