<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World AI & Business News</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--fg:#1d1d1b;--mut:#6b6b66;--line:#e3e3dd;--acc:#1d6fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--fg:#eeeeea;--mut:#9a9a94;--line:#33332f;--acc:#6aa8ff}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--fg:#eeeeea;--mut:#9a9a94;--line:#33332f;--acc:#6aa8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Noto Sans Bengali','Kalpurush',sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:18px;padding:6px 13px;font-size:14px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 6px}
.brief h3{font-size:15px;margin:12px 0 4px}
.brief ul{margin:4px 0;padding-left:20px}
.brief li{margin:5px 0;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.item a{color:var(--fg);text-decoration:none;font-weight:600}
.item a:hover{color:var(--acc)}
.meta{font-size:12px;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.snip{font-size:13px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<main>
<h1>🌍 World AI & Business News</h1>
<div class="sub" id="upd">Loading…</div>
<div id="briefs"></div>
<input id="q" placeholder="Search headlines…">
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</main>
<script>
const TOPICS=['All','Bangladesh','AI','Business','Tech'];
const L={en:{All:'All',Bangladesh:'Bangladesh',AI:'AI',Business:'Business',Tech:'Tech',title:'🌍 World AI & Business News',search:'Search headlines…',wait:'Waiting for first update…',upd:'Updated',auto:'auto-refreshes',none:'No news yet.',mor:'☀️ Morning Brief',ngt:'🌙 Night Brief',m:'m ago',h:'h ago',d:'d ago',btn:'বাংলা'},
bn:{All:'সব',Bangladesh:'বাংলাদেশ',AI:'এআই',Business:'ব্যবসা',Tech:'প্রযুক্তি',title:'🌍 বিশ্বের এআই ও ব্যবসার খবর',search:'শিরোনাম খুঁজুন…',wait:'প্রথম আপডেটের অপেক্ষায়…',upd:'আপডেট',auto:'নিজে থেকেই রিফ্রেশ হয়',none:'এখনো কোনো খবর নেই।',mor:'☀️ সকালের সারাংশ',ngt:'🌙 রাতের সারাংশ',m:' মিনিট আগে',h:' ঘণ্টা আগে',d:' দিন আগে',btn:'English'}};
let lang=localStorage.getItem('lang')||'en',topic='All',items=[],q='',news={},br={};
const bd=n=>lang==='bn'?String(n).replace(/\d/g,x=>'০১২৩৪৫৬৭৮৯'[x]):n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=d=>{const m=Math.max(0,(Date.now()-new Date(d))/60000),t=L[lang];return bd(m<60?Math.floor(m)+t.m:m<1440?Math.floor(m/60)+t.h:Math.floor(m/1440)+t.d)};
function md(t){let h='',ul=false;const b=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');for(const raw of t.split('\n')){const l=esc(raw.trim());
 if(l.startsWith('## ')){if(ul){h+='</ul>';ul=false}h+='<h3>'+b(l.slice(3))+'</h3>'}
 else if(/^[-*] /.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+b(l.slice(2))+'</li>'}
 else if(l){if(ul){h+='</ul>';ul=false}h+='<p>'+b(l)+'</p>'}}
 return h+(ul?'</ul>':'')}
function renderTabs(){document.getElementById('tabs').innerHTML=TOPICS.map(t=>`<button class="${t===topic?'on':''}" onclick="topic='${t}';renderTabs();renderList()">${L[lang][t]}</button>`).join('')+`<button onclick="lang=lang==='en'?'bn':'en';localStorage.setItem('lang',lang);renderAll()">${L[lang].btn}</button>`}
function renderList(){const f=items.filter(i=>(topic==='All'||i.topic===topic)&&(!q||(i.title+i.snippet).toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=f.slice(0,150).map(i=>`<div class="card item"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="meta"><span class="tag">${esc(L[lang][i.topic]||i.topic)}</span>${esc(i.source)} · ${ago(i.date)}</div>${i.snippet?`<div class="snip">${esc(i.snippet.slice(0,160))}…</div>`:''}</div>`).join('')||`<div class="card">${L[lang].none}</div>`}
function renderBriefs(){if(!br.m)return;const t=L[lang],pick=b=>(lang==='bn'&&b.text_bn)||b.text||b.text_bn||'';
 const c=(b,l)=>`<details class="card brief"><summary>${l}${b.generated?' · '+ago(b.generated):''}</summary>${md(pick(b))}</details>`;
 const newer=new Date(br.m.generated||0)>new Date(br.n.generated||0);
 document.getElementById('briefs').innerHTML=newer?c(br.m,t.mor)+c(br.n,t.ngt):c(br.n,t.ngt)+c(br.m,t.mor)}
function renderAll(){const t=L[lang];document.documentElement.lang=lang;document.querySelector('h1').textContent=t.title;document.getElementById('q').placeholder=t.search;
 document.getElementById('upd').textContent=news.updated?t.upd+' '+ago(news.updated)+' · '+t.auto:t.wait;renderTabs();renderList();renderBriefs()}
async function j(p){const r=await fetch(p+'?t='+Date.now());return r.json()}
async function load(){
 try{news=await j('data/news.json');items=news.items||[]}catch(e){}
 try{const [m,n]=await Promise.all([j('data/brief-morning.json'),j('data/brief-night.json')]);br={m,n}}catch(e){}
 renderAll()}
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();renderList()};
load();setInterval(load,180000);
</script>
</body>
</html>
